<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workplace Word</title>
  </head>
  <body>
    <div id="debug-overlay" style="position:fixed;top:0;left:0;background:rgba(255,0,0,0.8);color:white;z-index:9999;padding:20px;display:none;font-family:monospace;white-space:pre-wrap;width:100%;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('debug-overlay');
        el.style.display = 'block';
        el.innerText += 'ERROR: ' + msg + '\n' + (error ? error.stack : '') + '\n\n';
      };
      var oldErr = console.error;
      console.error = function() {
        var el = document.getElementById('debug-overlay');
        el.style.display = 'block';
        el.innerText += 'CONSOLE ERROR: ' + Array.from(arguments).join(' ') + '\n\n';
        oldErr.apply(console, arguments);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
